services:
  - type: web
    name: chorva-erp-cloud
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET
        generateValue: true
      - key: CHORVA_BOT_TOKEN
        sync: false
      - key: PRAYER_BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        value: "225011967"
      - key: DATABASE_URL
        fromDatabase:
          name: chorva-db
          property: connectionString

databases:
  - name: chorva-db
    databaseName: chorva_erp
    user: chorva_user
    plan: free
